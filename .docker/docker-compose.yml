volumes:
  db_data:
  static:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/static
  media:

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data:cached
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          memory: 512M

  migrations:
    image: vbamnup/svz-backend:v0.1amd64
    env_file:
      - .env
    command: python manage.py makemigrations && python manage.py migrate
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: vbamnup/svz-backend:v0.1amd64
    restart: always
    volumes:
      - ./static:/src/static:cached
      - media:/src/media:cached
    env_file:
      - .env
    depends_on:
      - migrations
#    healthcheck:
#      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
#      interval: 30s
#      timeout: 5s
#      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 1.5G
        reservations:
          memory: 1G

  frontend:
    image: vbamnup/svz-frontend:0.1amd
    restart: always
    volumes:
      - static:/frontend/static:cached
    depends_on:
      - backend
#    env_file:
#      - .env.prod
#      backend:
#        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 1G
        reservations:
          memory: 512M

  nginx:
    image: nginx:1.19-alpine
    restart: always
    volumes:
      - static:/frontend/static:cached
      - ./static:/backend/static:cached
      - media:/backend/media:cached
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M
        reservations:
          memory: 256M