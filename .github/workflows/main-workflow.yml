name: Sous-Backend Build

on:
  push:
    branches: ["devops-docker-files"]
  pull_request:
    branches: ["devops-docker-files"]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: sousvidzen/backend:dev

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            # Docker login using environment variables
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Navigate to the deploy user's home directory
            cd /home/deploy

            # Create sous directory if it doesn't exist
            mkdir -p sous
            cd sous

            # Create docker-compose.yml
            cat << EOF > docker-compose.yml
            version: "3.8"

            services:
              backend:
                image: sousvidzen/backend:dev
                container_name: sous-vid-zen-backend
                ports:
                  - "8000:8000"
                environment:
                  - NODE_ENV=production
                restart: unless-stopped
                networks:
                  - sous-vid-zen-network

            networks:
              sous-vid-zen-network:
                driver: bridge
            EOF

            # Pull and start Docker containers
            docker-compose pull
            docker-compose up -d

            # Docker logout
            docker logout