name: Build and Push Sous-Vid-Zen Backend

on:
  push:
    branches: ["devops-docker-files"]
  pull_request:
    branches: ["devops-docker-files"]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: sousvidzen/backend:dev

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the deploy user's home directory
            cd /home/deploy

            # If the directory doesn't exist, create it and clone the repository
            if [ ! -d "sous" ]; then
              git clone https://github.com/Sous-Vide-Zen/docker-compose.git sous
            fi

            # Navigate into the project directory
            cd sous

            # Fetch and pull the latest changes
            git fetch --all
            git checkout devops-docker-files || git checkout -b devops-docker-files
            git pull origin devops-docker-files

            # Create docker-compose.yml if it doesn't exist
            if [ ! -f "docker-compose.yml" ]; then
              echo "Creating docker-compose.yml"
              echo 'version: "3.8"' > docker-compose.yml
              echo '' >> docker-compose.yml
              echo 'services:' >> docker-compose.yml
              echo '  backend:' >> docker-compose.yml
              echo '    image: sousvidzen/backend:dev' >> docker-compose.yml
              echo '    container_name: sous-vid-zen-backend' >> docker-compose.yml
              echo '    ports:' >> docker-compose.yml
              echo '      - "8080:8080"' >> docker-compose.yml
              echo '    environment:' >> docker-compose.yml
              echo '      - NODE_ENV=production' >> docker-compose.yml
              echo '    restart: unless-stopped' >> docker-compose.yml
              echo '    networks:' >> docker-compose.yml
              echo '      - sous-vid-zen-network' >> docker-compose.yml
              echo '' >> docker-compose.yml
              echo 'networks:' >> docker-compose.yml
              echo '  sous-vid-zen-network:' >> docker-compose.yml
              echo '    driver: bridge' >> docker-compose.yml
            fi

            # Pull and start Docker containers
            docker-compose pull
            docker-compose up -d