name: Build and Push Sous-Vid-Zen Backend

on:
  push:
    branches: ["devops-docker-files"]
  pull_request:
    branches: ["devops-docker-files"]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: .docker/Dockerfile
          push: true
          tags: sousvidzen/backend:dev

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            
            cd /home/deploy

            if [ ! -d "sous" ]; then
              git clone https://github.com/Sous-Vide-Zen/docker-compose.git sous
            fi

            cd sous

            git fetch --all
            git checkout devops-docker-files
            git pull origin devops-docker-files

            if [ ! -f "docker-compose.yml" ]; then
              echo "Error: docker-compose.yml not found"
              exit 1
            fi

            docker-compose pull
            docker-compose up -d