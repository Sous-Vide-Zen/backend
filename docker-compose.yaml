version: '3.8'
name: sous-vide-zen
services:
  db:
    build:
      context: ./
      dockerfile: ./.docker/DockerfilePostgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
      - PGDATA=/var/lib/postgresql/data/sous-api/
    volumes:
      - pg-data:/var/lib/postgresql/data
    command:
      ['postgres', '-c', 'logging_collector=on', '-c', 'log_statement=all']
    networks:
      - my_network
    ports:
      - ${PG_PORT}:${PG_PORT}
    healthcheck:
      test: ['CMD', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg-data:
  pg-log:

networks:
  my_network:
    driver: bridge
